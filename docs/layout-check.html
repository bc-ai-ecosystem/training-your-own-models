<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Temporary responsive layout check</title><style>body{font:14px Arial,sans-serif;background:#e9e9e3;padding:20px}main{display:flex;gap:30px;align-items:flex-start}iframe{display:block;border:1px solid #444;background:white}label{display:block;margin:15px 0}select{padding:9px}h1{font-size:24px}</style></head><body><h1>Responsive layout check</h1><p>Same-origin narrow viewports. This checks responsive layout, not mobile-device emulation.</p><label>Book page <select id="page"><option value="index.html">Home</option><option value="chapters/01.html">Chapter 1</option><option value="chapters/15.html">Chapter 15</option><option value="chapters/glossary.html">Glossary</option><option value="search.html">Search</option><option value="labs.html">Learning tools</option><option value="downloads.html">Downloads</option></select></label><main><section><h2>320 pixels</h2><iframe id="frame320" title="320 pixel book viewport" width="320" height="1000" src="index.html"></iframe></section><section><h2>375 pixels</h2><iframe id="frame375" title="375 pixel book viewport" width="375" height="1000" src="index.html"></iframe></section></main><script>document.getElementById('page').addEventListener('change',e=>document.querySelectorAll('iframe').forEach(f=>f.src=e.target.value));</script></body></html>
